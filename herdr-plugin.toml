id = "gitbridge"
name = "GitBridge for Herdr"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "GitBridge installs Herdr plugins from any Git transport with reviewed builds, version history and multi-forge discovery."
platforms = ["linux", "macos", "windows"]

# Builds bin/herdr-pm from source (needs a Rust toolchain), unless a
# matching prebuilt bin/herdr-pm is already in the checkout.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/build.ps1"]

[[panes]]
id = "manager"
title = "GitBridge"
placement = "popup"
width = "85%"
height = "85%"
command = ["./bin/herdr-pm"]

[[actions]]
id = "open"
title = "Open plugin manager"
contexts = ["workspace"]
command = ["./bin/herdr-pm", "open"]
