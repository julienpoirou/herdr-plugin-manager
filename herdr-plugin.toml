id = "julienpoirou.herdr-plugin-manager"
name = "Herdr Plugin Manager"
# x-release-please-start-version
version = "0.16.1"
# x-release-please-end
min_herdr_version = "0.7.4"
description = "Installs Herdr plugins from any Git transport with reviewed builds, version history and multi-forge discovery."
platforms = ["linux", "macos", "windows"]

# Builds bin/herdr-pm from source (needs a Rust toolchain), unless a
# matching prebuilt bin/herdr-pm is already in the checkout.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/build.ps1"]

[[panes]]
id = "manager"
title = "Herdr Plugin Manager"
placement = "popup"
width = "85%"
height = "85%"
command = ["./bin/herdr-pm"]

[[actions]]
id = "open"
title = "Open plugin manager"
contexts = ["workspace"]
command = ["./bin/herdr-pm", "open"]

# Auto-update (A in the popup). `[auto_update] trigger` in config.toml decides
# which of these updates; the others exit right after reading it.
[[startup]]
command = ["./bin/herdr-pm", "auto-update", "--hook", "startup"]

[[events]]
on = "tab.created"
command = ["./bin/herdr-pm", "auto-update", "--hook", "event"]

[[events]]
on = "pane.created"
command = ["./bin/herdr-pm", "auto-update", "--hook", "event"]
