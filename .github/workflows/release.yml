name: Release

# Pushes to main keep a release-please pull request up to date. Merging it
# tags the version, creates the GitHub release, and publishes the binaries
# and crate from that exact commit.
#
# workflow_dispatch on main publishes (or republishes) a given tag. A missing
# tag is created on that run's commit; every published commit must belong to main.
#
# Pull requests that touch the release inputs run every binary build
# without publishing anything.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .release-please-config.json
      - .release-please-manifest.json
      - Cargo.toml
      - Cargo.lock
      - herdr-plugin.toml
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0 (Cargo.toml and herdr-plugin.toml must carry that version)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    name: Resolve release
    needs: release-please
    if: >-
      !cancelled() &&
      (github.event_name != 'push' || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Require trusted manual workflow
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Manual releases must run from main"
            exit 1
          fi
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Dry run: the version the pull request would release.
            publish=false
            TAG="v$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if [[ "$publish" == true ]] && git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          else
            sha="$GITHUB_SHA"
          fi
          # Tags can point outside main. Reject those commits before any build
          # can execute them in the default branch's writable cache scope.
          if [[ "$publish" == true ]]; then
            if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
              echo "::error::Release commit $sha is not reachable from trusted main"
              exit 1
            fi
          fi
          git show "$sha:Cargo.toml" > "$RUNNER_TEMP/Cargo.toml"
          git show "$sha:herdr-plugin.toml" > "$RUNNER_TEMP/herdr-plugin.toml"
          version="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' "$RUNNER_TEMP/Cargo.toml")"
          plugin="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' "$RUNNER_TEMP/herdr-plugin.toml")"
          if [[ "$version" != "${TAG#v}" || "$plugin" != "$version" ]]; then
            echo "::error::$TAG does not match $sha (Cargo.toml $version, herdr-plugin.toml $plugin)"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "sha=$sha"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG from $sha (prerelease: $prerelease, publish: $publish)"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    # release-please is skipped outside pushes; without an explicit condition
    # that skip would propagate to every downstream job.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Select trusted release commit
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          git checkout --detach "$RELEASE_SHA"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Static Linux binaries: ring's C code must be compiled for musl too.
          if [[ "$TARGET" == *-musl ]]; then export "CC_${TARGET//-/_}=musl-gcc"; fi
          cargo build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          exe=herdr-pm
          if [[ "$TARGET" == *-windows-* ]]; then exe=herdr-pm.exe; fi
          bin="target/$TARGET/release/$exe"
          # Every release target is built on its native architecture.
          reported="$("$bin" --version)"
          if [[ "$reported" != "herdr-pm $VERSION" ]]; then
            echo "::error::$bin reports '$reported', expected 'herdr-pm $VERSION'"
            exit 1
          fi
          name="herdr-plugin-manager-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "$bin" README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *-windows-* ]]; then
            archive="$name.zip"
            7z a -tzip -bso0 "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-plugin-manager-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Select trusted release commit
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          git checkout --detach "$SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: herdr-plugin-manager-*
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The CHANGELOG.md section of this version ("## 0.2.0 — …" or
            # release-please's "## [0.3.0](…) (…)").
            awk -v v="$VERSION" '
              $1 == "##" { h = $2; sub(/^\[/, "", h); sub(/\].*$/, "", h); if (found) exit; found = (h == v); next }
              found
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
              echo "See [CHANGELOG.md](CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
            fi
            flags=()
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --target "$SHA" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber

  crates-io:
    name: crates.io
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - id: gate
        name: Choose publish or skip
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
            mode=skip
          elif [[ "$(curl -sS -o /dev/null -w '%{http_code}' \
                    -A "herdr-plugin-manager-release (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
                    "https://crates.io/api/v1/crates/herdr-plugin-manager/$VERSION")" == 200 ]]; then
            echo "::notice::herdr-plugin-manager $VERSION is already on crates.io"
            mode=skip
          else
            mode=publish
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.mode != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Select trusted release commit
        if: steps.gate.outputs.mode == 'publish'
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          git checkout --detach "$RELEASE_SHA"
      - if: steps.gate.outputs.mode == 'publish'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - if: steps.gate.outputs.mode == 'publish'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  crates-dry-run:
    name: crates.io dry run
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.publish == 'false' && needs.plan.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo publish --locked --dry-run
