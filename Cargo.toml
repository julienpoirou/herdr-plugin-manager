[package]
name = "gitbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "GitBridge for Herdr: reviewed installs from any Git transport, rollback, and multi-forge plugin discovery."
license = "MIT"
keywords = ["herdr", "herdr-plugin", "tui", "plugin-manager", "git"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdr-pm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
