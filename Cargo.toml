[package]
name = "herdr-plugin-manager"
version = "0.13.0"
edition = "2021"
rust-version = "1.89"
description = "Herdr Plugin Manager: reviewed installs from any Git transport, rollback, and multi-forge plugin discovery."
license = "MIT"
repository = "https://github.com/julienpoirou/herdr-plugin-manager"
readme = "README.md"
keywords = ["herdr", "herdr-plugin", "tui", "plugin-manager", "git"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdr-pm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs", "gzip"] }

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
