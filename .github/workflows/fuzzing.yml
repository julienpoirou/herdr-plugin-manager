name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [manifest, source]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action implementation
        with:
          toolchain: nightly-2026-11-01
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fetch locked fuzz dependencies
        run: cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Fuzz production parsers
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/fuzz-corpus"
          cp -R "fuzz/seeds/$FUZZ_TARGET" "$corpus"
          CARGO_NET_OFFLINE=true cargo fuzz run "$FUZZ_TARGET" "$corpus" -- \
            -max_total_time=60 -max_len=32768 -rss_limit_mb=2048 -timeout=5
      - name: Preserve crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
